
name: DAST Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Safe Website Directory
        run: |
          mkdir -p site

          if [ -z "$(find site -type f -print -quit)" ]; then
            echo '<!DOCTYPE html><html><head><title>DAST Test Site</title></head><body><h1>DAST Scan Test Page</h1></body></html>' > site/index.html
          fi

      - name: Start Website
        run: |
          python3 -m http.server 8000 --directory site > server.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Website is running."
              exit 0
            fi
            sleep 2
          done
          echo "Website failed to start."
          cat server.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -J /zap/wrk/report_json.json \
            -w /zap/wrk/report_md.md \
            -r /zap/wrk/report_html.html

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_md.md
            report_html.html
          if-no-files-found: warn
